# StudyFlow — static deploy config for Netlify.
#
# The app is pure static + browser localStorage, with serverless functions
# for Gmail integration. Functions use Netlify Blobs for token storage.

[build]
  base = "web"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Single-page app: serve index.html for any path (except functions).
[[redirects]]
  from = "/.netlify/functions/*"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
