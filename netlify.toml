# StudyFlow — static deploy config for Netlify.
#
# The app is pure static + browser localStorage, with serverless functions
# for Gmail integration. Functions use Netlify Blobs for token storage.

[build]
  base = "web"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Single-page app: serve index.html for any path.
# Functions are served automatically at /.netlify/functions/*
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
