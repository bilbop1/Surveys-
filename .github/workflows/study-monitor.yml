name: Study Monitor

on:
  schedule:
    # Run every 2 hours during peak hours (8am-10pm EST)
    - cron: '0 13-3/2 * * *'  # UTC offset for EST
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to check'
        required: false
        default: 'respondent,userinterviews,prolific'
      min_pay:
        description: 'Minimum pay threshold in USD'
        required: false
        default: '25'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run monitor
        env:
          RESPONDENT_EMAIL: ${{ secrets.RESPONDENT_EMAIL }}
          RESPONDENT_PASSWORD: ${{ secrets.RESPONDENT_PASSWORD }}
          USERINTERVIEWS_EMAIL: ${{ secrets.USERINTERVIEWS_EMAIL }}
          USERINTERVIEWS_PASSWORD: ${{ secrets.USERINTERVIEWS_PASSWORD }}
          USERTESTING_EMAIL: ${{ secrets.USERTESTING_EMAIL }}
          USERTESTING_PASSWORD: ${{ secrets.USERTESTING_PASSWORD }}
          PROLIFIC_EMAIL: ${{ secrets.PROLIFIC_EMAIL }}
          PROLIFIC_PASSWORD: ${{ secrets.PROLIFIC_PASSWORD }}
          DSCOUT_EMAIL: ${{ secrets.DSCOUT_EMAIL }}
          DSCOUT_PASSWORD: ${{ secrets.DSCOUT_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          MIN_PAY_THRESHOLD: ${{ github.event.inputs.min_pay || '25' }}
          HEADLESS: 'true'
        run: |
          PLATFORMS="${{ github.event.inputs.platforms || 'respondent,userinterviews,prolific,usertesting,dscout' }}"
          node src/cli.js monitor --platforms "$PLATFORMS" --min-pay "$MIN_PAY_THRESHOLD" --verbose

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-screenshots-${{ github.run_number }}
          path: data/screenshots/
          retention-days: 7

      - name: Upload database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-database-${{ github.run_number }}
          path: data/zarb.db
          retention-days: 30
